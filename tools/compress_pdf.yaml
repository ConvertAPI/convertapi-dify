identity:
  name: compress_pdf
  author: convertapi
  label:
    en_US: Compress PDF
description:
  human:
    en_US: Reduce PDF file size by up to 90% by optimizing images and fonts.
  llm: Compress a PDF to make it smaller. Choose a preset from lossless to text (smallest).
parameters:
  - name: input_file
    type: file
    required: true
    form: llm
    label:
      en_US: PDF file
    human_description:
      en_US: The PDF to compress.
    llm_description: The PDF file to compress.
  - name: preset
    type: select
    required: false
    default: web
    form: llm
    label:
      en_US: Compression preset
    human_description:
      en_US: Balance between file size and image quality.
    llm_description: "Compression preset: lossless (no quality loss), printer (300 DPI), ebook (150 DPI), web (96 DPI, default), archive (40 DPI) or text (20 DPI, smallest)."
    options:
      - value: lossless
        label:
          en_US: Lossless (no quality loss)
      - value: printer
        label:
          en_US: Printer (300 DPI)
      - value: ebook
        label:
          en_US: Ebook (150 DPI)
      - value: web
        label:
          en_US: Web (96 DPI)
      - value: archive
        label:
          en_US: Archive (40 DPI)
      - value: text
        label:
          en_US: Text (20 DPI, smallest)
  - name: password
    type: secret-input
    required: false
    form: form
    label:
      en_US: Open password
    human_description:
      en_US: Password of a protected input document.
    llm_description: Password to open a protected input document.
  - name: extra_parameters
    type: string
    required: false
    form: form
    label:
      en_US: Extra parameters (JSON)
    human_description:
      en_US: 'Optional ConvertAPI parameters as a JSON object, for example {"PageRange": "1-3"}. See the converter page on convertapi.com for the full list.'
    llm_description: Optional JSON object of extra ConvertAPI conversion parameters.
extra:
  python:
    source: tools/compress_pdf.py
