identity:
  name: pdf_to_word
  author: convertapi
  label:
    en_US: PDF to Word
description:
  human:
    en_US: Convert a PDF to an editable Word document (DOCX). Scanned pages are recognized with OCR.
  llm: Convert a PDF file to an editable Word DOCX document.
parameters:
  - name: input_file
    type: file
    required: true
    form: llm
    label:
      en_US: PDF file
    human_description:
      en_US: The PDF to convert.
    llm_description: The PDF file to convert to Word.
  - name: page_range
    type: string
    required: false
    form: llm
    label:
      en_US: Page range
    human_description:
      en_US: Pages to convert, for example 1-10 or 1,2,5. Leave empty for all pages.
    llm_description: Pages to convert, for example 1-10 or 1,2,5. Leave empty for all pages.
  - name: password
    type: secret-input
    required: false
    form: form
    label:
      en_US: Open password
    human_description:
      en_US: Password of a protected input document.
    llm_description: Password to open a protected input document.
  - name: extra_parameters
    type: string
    required: false
    form: form
    label:
      en_US: Extra parameters (JSON)
    human_description:
      en_US: 'Optional ConvertAPI parameters as a JSON object, for example {"PageRange": "1-3"}. See the converter page on convertapi.com for the full list.'
    llm_description: Optional JSON object of extra ConvertAPI conversion parameters.
extra:
  python:
    source: tools/pdf_to_word.py
